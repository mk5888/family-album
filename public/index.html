<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭相冊</title><style>body{margin:0;background:#0f172a;color:#f8fafc;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:16px}.hidden{display:none}#login{max-width:360px;margin:12vh auto;background:#1e293b;padding:24px;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}button{background:#4f46e5;color:white}.gallery{columns:2 180px;gap:10px}.gallery img{width:100%;margin:0 0 10px;border-radius:8px;cursor:pointer}.error{color:#fca5a5}</style></head><body><header><strong>家庭相冊</strong><button id="logout" class="hidden">登出</button></header><section id="login"><h1>家庭相冊</h1><p>輸入通行碼以安全方式開始工作階段。</p><form id="loginForm"><input id="passcode" type="password" autocomplete="current-password" required placeholder="通行碼"><button>進入相冊</button><p id="error" class="error"></p></form></section><main id="app" class="hidden"><h2 id="title"></h2><div id="tabs"></div><p id="count"></p><div id="gallery" class="gallery"></div></main><script>const login=document.querySelector('#login'),app=document.querySelector('#app'),error=document.querySelector('#error'),tabs=document.querySelector('#tabs'),gallery=document.querySelector('#gallery');let albumId='';async function api(url,opt={}){const r=await fetch(url,opt);if(r.status===401)throw Error('登入已過期');if(!r.ok)throw Error('目前無法載入相冊');return r.status===204?null:r.json()}async function loadAlbum(id){albumId=id;const data=await api('/api/albums/'+encodeURIComponent(id));document.querySelector('#title').textContent=data.name;document.querySelector('#count').textContent=`共 ${data.count} 張`;gallery.replaceChildren(...data.photos.map(p=>{const i=new Image();i.loading='lazy';i.src='/api/img?path='+encodeURIComponent(p.path)+'&s=thumb';i.onclick=()=>window.open('/api/img?path='+encodeURIComponent(p.path)+'&s=hd','_blank','noopener');return i}))}async function start(){try{const albums=await api('/api/albums');login.classList.add('hidden');app.classList.remove('hidden');document.querySelector('#logout').classList.remove('hidden');tabs.replaceChildren(...albums.map(a=>{const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>loadAlbum(a.id);return b}));if(albums[0])loadAlbum(albums[0].id)}catch{login.classList.remove('hidden');app.classList.add('hidden')}}document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();error.textContent='';try{await api('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:document.querySelector('#passcode').value})});e.target.reset();start()}catch(e){error.textContent=e.message}};document.querySelector('#logout').onclick=async()=>{await fetch('/api/session',{method:'DELETE'});start()};start();</script></body></html>
